            .container {

}

  letter-spacing: 4px;

a {
  color: rgba(255, 255, 255, 1);
  font-weight: bold;

a:hover {

}

body {

.music-btn {
  position: fixed;
  top: 20px;
  left: 20px;
  background: rgba(55, 40, 30, 0.6);
  border: 2px solid rgba(1, 11, 1, 0.395);
  color: white;
  cursor: pointer;
  border-radius: 50%;
  width: 45px;
  height: 45px;
  z-index: 9999;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0;
  line-height: 1;
  font-size: 20px;
  transition: 0.3s;
}

@keyframes bounce {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}

.music-btn.playing {
  animation: bounce 0.6s infinite ease-in-out;
  border-color: rgba(255, 255, 255, 0.1);
  box-shadow: 0 0 15px rgba(55, 40, 30, 0.6);
}

#music-time {

  font-family: monospace;
  position: fixed;
  top: 70px;
  left: 20px;
  z-index: 9999;
  text-shadow: 1px 1px 2px black;
}

    <audio id="bg-music" loop>
    <source src="https://static.wikia.nocookie.net/starwars/images/c/cc/MainTitle.flac/revision/latest?cb=20250411190700" type="audio/flac">
  </audio>

  <button id="play-btn" onclick="playMusic()" class="music-btn">🎵</button>
  <span id="music-time">0:00</span>
  
<script>
  window.onload = function() {
    const audio = document.getElementById("bg-music");
    const btn = document.getElementById("play-btn");
    const timeDisplay = document.getElementById("music-time");


    window.playMusic = function() {
      if (audio.paused) {
        audio.play().then(() => {
          btn.classList.add("playing");
        }).catch(err => {
          console.log("Muziek kon niet starten:", err);
        });
      } else {
        audio.pause();
        audio.currentTime = 0;
        btn.classList.remove("playing");
        timeDisplay.innerText = "0:00";
      }
    };

  
    audio.addEventListener('timeupdate', () => {
      const mins = Math.floor(audio.currentTime / 60);
      const secs = Math.floor(audio.currentTime % 60);
      timeDisplay.innerText = mins + ":" + secs.toString().padStart(2, '0');
    });
  };
  // --- Link Preview Removal Code ---
    document.querySelectorAll('.no-preview').forEach(link => {
      // Temporarily store original href destination
      const originalUrl = link.getAttribute('href');
      
      // Strip href on hover so browser status bar remains blank
      link.addEventListener('mouseover', function() {
        this.removeAttribute('href');
      });

      // Restore href if mouse exits link boundary
      link.addEventListener('mouseout', function() {
        this.setAttribute('href', originalUrl);
      });

      // Navigate to destination on click via background JavaScript
      link.addEventListener('click', function(e) {
        e.preventDefault(); 
        window.open(originalUrl, '_blank'); 
      });
    });
</script>
